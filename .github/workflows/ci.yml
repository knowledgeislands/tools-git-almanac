name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  governance:
    name: KI governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
      - run: bun install --frozen-lockfile
      - name: Install and verify released KI
        env:
          KI_VERSION: v0.3.5
          KI_CLI_INSTALL_DIR: ${{ runner.temp }}/ki/bin
          KI_MAN_INSTALL_DIR: ${{ runner.temp }}/ki/man/man1
          KI_DATA_HOME: ${{ runner.temp }}/ki/data
          KI_CONFIG_HOME: ${{ runner.temp }}/ki/config
          KI_CACHE_HOME: ${{ runner.temp }}/ki/cache
          XDG_STATE_HOME: ${{ runner.temp }}/ki/state
          KI_STATE_HOME: ${{ runner.temp }}/ki/state/ki
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.agents/skills" "$HOME/.claude"
          printf '{}\n' > "$HOME/.claude/settings.json"
          curl --fail --silent --show-error --location --max-redirs 3 \
            --proto '=https' --proto-redir '=https' \
            --output "$RUNNER_TEMP/ki-install.sh" \
            "https://raw.githubusercontent.com/knowledgeislands/tools-ki/$KI_VERSION/install.sh"
          bash "$RUNNER_TEMP/ki-install.sh" "$KI_VERSION"
          export PATH="$KI_CLI_INSTALL_DIR:$PATH"
          test "$(command -v ki)" = "$KI_CLI_INSTALL_DIR/ki"
          test "$(ki --version)" = "${KI_VERSION#v}"
          ki bootstrap
          for skill in ki-housekeeping-claude ki-tokenomics ki-tokenomics-claude ki-tokenomics-codex; do
            ki repo skill add "$skill" --repo .
          done
          ki registry add --repo .
          ki harness list
          {
            printf 'KI_CLI_INSTALL_DIR=%s\n' "$KI_CLI_INSTALL_DIR"
            printf 'KI_MAN_INSTALL_DIR=%s\n' "$KI_MAN_INSTALL_DIR"
            printf 'KI_DATA_HOME=%s\n' "$KI_DATA_HOME"
            printf 'KI_CONFIG_HOME=%s\n' "$KI_CONFIG_HOME"
            printf 'KI_CACHE_HOME=%s\n' "$KI_CACHE_HOME"
            printf 'XDG_STATE_HOME=%s\n' "$XDG_STATE_HOME"
            printf 'KI_STATE_HOME=%s\n' "$KI_STATE_HOME"
          } >> "$GITHUB_ENV"
          printf '%s\n' "$KI_CLI_INSTALL_DIR" >> "$GITHUB_PATH"
      - run: ki repo audit --repo .

  build:
    name: Build and test
    needs: governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run test:coverage
      - run: bun run build
      - run: ./dist/cli/cli.js --version
      - run: ./bin/git-almanac calendar . --format svg --output "$RUNNER_TEMP/git-almanac.svg"
      - run: test -s "$RUNNER_TEMP/git-almanac.svg"

  manual:
    name: Manual
    needs: governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
      - run: sudo apt-get update && sudo apt-get install --yes mandoc
      - run: bun run ki:tools:lint-man

  installer:
    name: Local installer
    needs: governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
      - run: |
          set -euo pipefail
          export GIT_ALMANAC_INSTALL_DIR="$RUNNER_TEMP/bin"
          export GIT_ALMANAC_MAN_INSTALL_DIR="$RUNNER_TEMP/man/man1"
          ./install.sh --link
          "$GIT_ALMANAC_INSTALL_DIR/git-almanac" --version
          test -L "$GIT_ALMANAC_MAN_INSTALL_DIR/git-almanac.1"
