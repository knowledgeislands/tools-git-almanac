name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Verify and publish immutable asset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
      - run: bun install --frozen-lockfile
      - run: bun run test:coverage
      - run: bun run build
      - run: sudo apt-get update && sudo apt-get install --yes mandoc
      - run: bun run ki:tools:lint-man
      - name: Build release asset
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').version")" = "${VERSION#v}"
          mkdir -p "release/git-almanac-$VERSION"
          bun build --target=node --minify --outfile "release/git-almanac-$VERSION/git-almanac" src/cli/cli.ts
          chmod 0755 "release/git-almanac-$VERSION/git-almanac"
          cp man/git-almanac.1 "release/git-almanac-$VERSION/git-almanac.1"
          tar -czf "release/git-almanac-$VERSION.tar.gz" -C release "git-almanac-$VERSION"
          (
            cd release
            sha256sum "git-almanac-$VERSION.tar.gz" > SHA256SUMS
          )
          "release/git-almanac-$VERSION/git-almanac" --version
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh release create "$VERSION" \
            "release/git-almanac-$VERSION.tar.gz" \
            "release/SHA256SUMS" \
            --generate-notes \
            --title "git-almanac $VERSION"

  notify-homebrew-tap:
    name: Notify Homebrew tap
    needs: release
    # Runs only once Kris has provisioned the shared release bot for this repository.
    if: vars.KI_TOOLS_RELEASE_BOT_APP_ID != ''
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Create tap-scoped release bot token
        id: release-bot
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.KI_TOOLS_RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.KI_TOOLS_RELEASE_BOT_PRIVATE_KEY }}
          owner: knowledgeislands
          repositories: homebrew-tap
      - name: Dispatch the published release to the tap
        env:
          GH_TOKEN: ${{ steps.release-bot.outputs.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          jq -n --arg repository "$GITHUB_REPOSITORY" --arg tag "$VERSION" \
            '{event_type: "tool-release-published", client_payload: {repository: $repository, tag: $tag}}' |
            gh api --method POST repos/knowledgeislands/homebrew-tap/dispatches --input -
          printf 'Dispatched %s %s to knowledgeislands/homebrew-tap\n' "$GITHUB_REPOSITORY" "$VERSION" >> "$GITHUB_STEP_SUMMARY"
